<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sappy">
<meta name="theme-color" content="#0D0E0B">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Sappy Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D0E0B; --card:#191B16; --card2:#23261F; --ink:#F3F5EE; --soft:#A2A79B; --faint:#6E7368; --line:#2A2D25;
  --lime:#CDF46A; --on:#12140D;
  box-sizing:border-box; color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{ --bg:#EEF0E9; --card:#FFFFFF; --card2:#F3F5EE; --ink:#12140D; --soft:#5F6559; --faint:#959A8E; --line:#E3E6DD; color-scheme:light; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px;border-radius:12px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:520px;margin:0 auto;padding:14px 18px 40px}

.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 26px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.01em}
.mark{width:36px;height:36px;border-radius:12px;background:var(--lime);color:var(--on);display:grid;place-items:center;font-weight:800;font-size:19px}
.date{font-size:13px;font-weight:700;color:var(--soft);background:var(--card);border-radius:999px;padding:8px 12px}

.hello{font-size:15px;font-weight:700;color:var(--soft)}
h1{font-size:clamp(32px,9.5vw,40px);line-height:1.05;letter-spacing:-.04em;margin:6px 0 24px;font-weight:800}
h1 em{font-style:normal;color:var(--lime)}

/* featured app */
.feat{display:block;border-radius:30px;padding:20px;color:var(--on);position:relative;overflow:hidden;margin-bottom:12px;transition:transform .15s}
.feat:active,.tile:active{transform:scale(.98)}
.feat::after{content:"";position:absolute;right:-50px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.45),rgba(255,255,255,0) 65%)}
.feat .row{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.feat .ico{width:48px;height:48px;border-radius:16px;background:rgba(18,20,13,.1);display:grid;place-items:center}
.feat .ico svg{width:26px;height:26px}
.feat .go{width:40px;height:40px;border-radius:50%;background:var(--on);color:var(--lime);display:grid;place-items:center;font-size:20px;font-weight:800}
.feat .nm{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:18px 0 2px;position:relative;z-index:1}
.feat .tg{font-size:14px;font-weight:600;opacity:.65;position:relative;z-index:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px;position:relative;z-index:1}
.stats div{background:var(--on);color:#F3F5EE;border-radius:18px;padding:11px 13px;min-width:0}
.stats span{display:block;font-size:12px;font-weight:600;color:#A2A79B}
.stats b{display:block;font-size:clamp(14px,4vw,17px);font-weight:800;white-space:nowrap}

/* other apps */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:grid;gap:26px;border-radius:26px;padding:16px;background:var(--card);position:relative;overflow:hidden;transition:transform .15s}
.tile .ico{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:var(--on)}
.tile .ico svg{width:24px;height:24px}
.tile .nm{font-size:17px;font-weight:800;letter-spacing:-.01em}
.tile .tg{font-size:13px;font-weight:600;color:var(--soft);margin-top:2px}
.tile.soon{opacity:.75}
.badge{position:absolute;top:14px;right:14px;font-size:11px;font-weight:800;background:var(--card2);color:var(--soft);border-radius:999px;padding:5px 9px}
.sec{font-size:13px;font-weight:700;color:var(--faint);margin:26px 4px 10px}
.foot{text-align:center;font-size:12px;color:var(--faint);margin-top:30px;font-weight:600}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="mark">S</span>Sappy Hub</div>
    <div class="date" id="date"></div>
  </header>

  <div class="hello" id="hello">Hello</div>
  <h1>All my records,<br><em>in one place.</em></h1>

  <div id="featured"></div>
  <div class="sec">My apps</div>
  <div class="grid" id="grid"></div>

  <p class="foot">Sappy Hub v<span id="ver"></span></p>
</div>

<script>
(function(){
"use strict";
const HUB_VERSION = "1.0.1";
/* ===== auto-update: iPhone keeps old copies, so check a tiny version file every launch ===== */
async function checkUpdate(VKEY, CUR, VURL, manual){
  try{
    const r=await fetch(VURL+"?t="+Date.now(),{cache:"no-store"}); if(!r.ok) throw 0;
    const want=(await r.json())[VKEY];
    if(want && want!==CUR){
      const k="upd-"+VKEY+"-"+want;
      if(sessionStorage.getItem(k) && !manual) return;   // avoid reload loops while GitHub is still publishing
      sessionStorage.setItem(k,"1");
      location.replace(location.pathname+"?v="+encodeURIComponent(want)+location.hash);
      return true;
    }
    return false;
  }catch(e){ return null; }
}


/* ================================================================
   APP LIST — to add a new app, add one line here and put its
   files in a folder with the same name as "url" (e.g. travel/).
   ready:false shows it as "Coming soon".
   ================================================================ */
const APPS = [
  { id:"pocket",  name:"Sappy Pocket",  tag:"Money & expenses",   url:"pocket/",  color:"#CDF46A", icon:"wallet", ready:true  },
  { id:"travel",  name:"Sappy Travel",  tag:"Trips & places",     url:"travel/",  color:"#8FDDFF", icon:"plane",  ready:false },
  { id:"fitness", name:"Sappy Fitness", tag:"Workouts & health",  url:"fitness/", color:"#FF9BBE", icon:"gym",    ready:false }
];

const ICONS = {
  wallet:'<path d="M4 7a2 2 0 0 1 2-2h12v4M4 7v10a2 2 0 0 0 2 2h14V9H6a2 2 0 0 1-2-2z"/><circle cx="16" cy="14" r="1.3"/>',
  plane:'<path d="M10.5 13.5 4 11l1.5-1.5 7 1L17 6a1.5 1.5 0 0 1 2.1 2.1L14.5 12.5l1 7L14 21l-2.5-6.5L8 18v2l-1.5 1-1-3-3-1 1-1.5h2z"/>',
  gym:'<path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/>',
  book:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>',
  heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>'
};
const svg = (n,c) => '<svg viewBox="0 0 24 24" fill="none" stroke="'+(c||"currentColor")+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[n]||ICONS.book)+'</svg>';
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n||0).toLocaleString("en-LK",{maximumFractionDigits:0});

/* live numbers from Sappy Pocket (same phone, same storage) */
function pocketStats(){
  try{
    const S=JSON.parse(localStorage.getItem("pocketledger.v2")||"null"); if(!S||!S.tx) return null;
    const now=new Date(), rate=c=>c==="LKR"||!c?1:((S.rate||{})[c]||0);
    const skip=new Set(["Transfers","Fixed deposit","Income"]);
    let spent=0; const latest={};
    Object.values(S.tx).forEach(t=>{
      if(!t||t.del) return;
      const d=new Date(t.ts);
      if(t.type==="out"&&!skip.has(t.cat)&&d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth())
        spent+= t.lkr!=null?t.lkr:t.amount*rate(t.cur);
      if(t.balance!=null){ const k=t.bank+"|"+(t.acct||"")+"|"+(t.cur||"LKR"); if(!latest[k]||t.ts>latest[k].ts) latest[k]=t; }
    });
    const bal=Object.values(latest).reduce((a,t)=>a+t.balance*rate(t.cur||"LKR"),0);
    return {spent, bal, hasBal:Object.keys(latest).length>0};
  }catch(e){ return null; }
}

function render(){
  const h=new Date().getHours();
  document.getElementById("hello").textContent = h<12?"Good morning":h<17?"Good afternoon":"Good evening";
  document.getElementById("date").textContent = new Date().toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
  document.getElementById("ver").textContent = HUB_VERSION;

  const ready=APPS.filter(a=>a.ready), feat=ready[0], rest=APPS.filter(a=>a!==feat);
  if(feat){
    let stats="";
    if(feat.id==="pocket"){ const p=pocketStats(); if(p) stats='<div class="stats"><div><span>Spent this month</span><b class="num">Rs '+fmt(p.spent)+'</b></div><div><span>Balance now</span><b class="num">'+(p.hasBal?'Rs '+fmt(p.bal):'—')+'</b></div></div>'; }
    document.getElementById("featured").innerHTML='<a class="feat" href="'+esc(feat.url)+'" style="background:'+feat.color+'"><div class="row"><span class="ico">'+svg(feat.icon,"#12140D")+'</span><span class="go">›</span></div><div class="nm">'+esc(feat.name)+'</div><div class="tg">'+esc(feat.tag)+'</div>'+stats+'</a>';
  }
  document.getElementById("grid").innerHTML=rest.map(a=>{
    const inner='<span class="ico" style="background:'+a.color+'">'+svg(a.icon,"#12140D")+'</span><div><div class="nm">'+esc(a.name)+'</div><div class="tg">'+esc(a.tag)+'</div></div>'+(a.ready?'':'<span class="badge">Coming soon</span>');
    return a.ready?'<a class="tile" href="'+esc(a.url)+'">'+inner+'</a>':'<div class="tile soon" aria-disabled="true">'+inner+'</div>';
  }).join("");
}
try{ const t=(JSON.parse(localStorage.getItem("pocketledger.v2")||"{}").theme)||"dark"; document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark"); }catch(e){}
render();
checkUpdate("hub",HUB_VERSION,"version.json");
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ render(); checkUpdate("hub",HUB_VERSION,"version.json"); } });
})();
</script>
</body>
</html>
